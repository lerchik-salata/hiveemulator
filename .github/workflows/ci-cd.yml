name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch: 

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/hiveemulator

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore & test
        working-directory: src/CommunicationControl
        run: |
          dotnet restore
          dotnet test --logger "console;verbosity=detailed" || echo "No tests yet"
        continue-on-error: true

  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & test
        working-directory: src/MapClient
        run: |
          npm install
          npm test -- --watchAll=false || echo "No tests yet"
        continue-on-error: true

  build-api:
    runs-on: ubuntu-latest
    needs: test-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: |
          cd src/CommunicationControl
          dotnet publish -c Release -o ./published \
            DevOpsProject/DevOpsProject.CommunicationControl.API.csproj
      - uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: src/CommunicationControl/published

  build-client:
    runs-on: ubuntu-latest
    needs: test-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd src/MapClient
          npm install
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: src/MapClient/dist

  docker-api:
    runs-on: ubuntu-latest
    needs: build-api
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "extra=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=dev-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "extra=dev-latest" >> $GITHUB_OUTPUT
          fi
      - uses: docker/build-push-action@v5
        with:
          context: src/CommunicationControl
          file: src/CommunicationControl/DevOpsProject/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/communication-control:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/communication-control:${{ steps.tag.outputs.extra }}

  docker-client:
    runs-on: ubuntu-latest
    needs: build-client
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "extra=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=dev-${{ github.run_number }}" >> $GITHUB_OUTPUT
            echo "extra=dev-latest" >> $GITHUB_OUTPUT
          fi
      - uses: docker/build-push-action@v5
        with:
          context: src/MapClient
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/map-client:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/map-client:${{ steps.tag.outputs.extra }}

  deploy-dev:
    runs-on: ubuntu-latest
    needs: [docker-api, docker-client]
    if: github.ref == 'refs/heads/dev'
    environment: development
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/hiveemulator-dev
            export GH_OWNER=${{ secrets.GH_OWNER }}
            export IMAGE_TAG=dev-${{ github.run_number }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker compose ps

  deploy-prod:
    runs-on: ubuntu-latest
    needs: [docker-api, docker-client]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/hiveemulator-prod
            export GH_OWNER=${{ secrets.GH_OWNER }}
            export IMAGE_TAG=1.0.${{ github.run_number }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker compose ps