services:
  redis:
    image: redis:alpine
    restart: always
    networks:
      - backend

  communication-control:
    image: ghcr.io/${GH_OWNER}/hiveemulator/communication-control:${IMAGE_TAG}
    restart: always
    ports:
      - "${API_PORT}:8080"
    environment:
      Redis__ConnectionString: "redis:6379"
      ASPNETCORE_ENVIRONMENT: "${ASPNET_ENV}"
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      - redis
    networks:
      - backend

  map-client:
    image: ghcr.io/${GH_OWNER}/hiveemulator/map-client:${IMAGE_TAG}
    restart: always
    ports:
      - "${UI_PORT}:80"
    volumes:
      - ./config.json:/usr/share/nginx/html/config.json:ro
    depends_on:
      - communication-control
    networks:
      - backend

networks:
  backend:
    driver: bridge